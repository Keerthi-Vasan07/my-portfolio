<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Scrambled Hover Text</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .text-block {
      max-width: 800px;
      font-size: clamp(18px, 4vw, 40px);
      line-height: 1.5;
      padding: 20px;
    }

    .char {
      display: inline-block;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="text-block">
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.
    </p>
  </div>

  <!-- ✅ GSAP (free) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // Split text into spans
    const paragraph = document.querySelector(".text-block p");
    const text = paragraph.textContent;
    paragraph.innerHTML = "";

    const scrambleChars = "!@#$%&*:;?";
    const chars = [];

    for (let i = 0; i < text.length; i++) {
      const span = document.createElement("span");
      span.className = "char";
      span.textContent = text[i];
      span.dataset.original = text[i];
      paragraph.appendChild(span);
      chars.push(span);
    }

    const radius = 100;

    // Animation on pointer move
    document.querySelector(".text-block").addEventListener("pointermove", (e) => {
      chars.forEach((char) => {
        const rect = char.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < radius) {
          scramble(char);
        }
      });
    });

    function scramble(char) {
      const original = char.dataset.original;
      if (char.scrambling) return;

      char.scrambling = true;

      const scrambleInterval = setInterval(() => {
        char.textContent = scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
      }, 40);

      setTimeout(() => {
        clearInterval(scrambleInterval);
        char.textContent = original;
        char.scrambling = false;
      }, 300 + Math.random() * 300); // Randomize duration a bit
    }
  </script>

</body>
</html>
